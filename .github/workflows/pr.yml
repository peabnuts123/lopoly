name: PR Check

on:
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 24 # @NOTE Should match .nvmrc

jobs:
  check-src:
    runs-on: ubuntu-latest
    name: Check PR
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Validate package version number
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-publish') }}
        run: npm run publish:validate-version

      - name: Lint, test, and build
        run: npm run checkall

  debug-preview-release-notes:
    runs-on: ubuntu-latest
    name: (DEBUG) Preview Release Notes
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Find previous release tag
        id: previous-tag
        run: echo "tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ github.event.pull_request.head.sha }}
          toTag: ${{ steps.previous-tag.outputs.tag }}
          writeToFile: false
          includeInvalidCommits: true
          excludeTypes: ''
          includeRefIssues: false
          useGitmojis: false

      - name: Print release notes
        env:
          CHANGES: ${{ steps.changelog.outputs.changes }}
        run: |
          echo '::group::Generated release notes'
          printf '%s\n' "$CHANGES"
          echo '::endgroup::'

  check-examples:
    runs-on: ubuntu-latest
    name: Check Examples
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix examples/development
          npm ci --prefix examples/rat-game

      - name: Check Development
        run: npm run checkall
        working-directory: examples/development

      - name: Check Rat Game
        run: npm run checkall
        working-directory: examples/rat-game
