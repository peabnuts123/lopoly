name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # Required for creating releases
  id-token: write # Required for npm Trusted Publishing
  pull-requests: read # Required for checking associated PR labels

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false
  queue: max

env:
  NODE_VERSION: 24 # @NOTE Should match .nvmrc

jobs:
  check-publish:
    runs-on: ubuntu-latest
    name: Check whether to publish
    outputs:
      should-publish: ${{ steps.label.outputs.should-publish }}
    steps:
      - name: Check associated PR labels
        id: label
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const skipPublish = pullRequests.some((pullRequest) =>
              pullRequest.labels.some((label) => label.name === 'no-publish'),
            );

            core.setOutput('should-publish', (!skipPublish).toString());

  publish:
    needs: check-publish
    if: needs.check-publish.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    name: Publish version
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # @NOTE Sanity check. This should be already validated
      # by PR, but this will catch any wonky action on main
      - name: Validate package version numbers
        run: npm run publish:validate-version

      - name: Read VERSION
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version" | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Publish to npm
        run: npm run publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docs:
    runs-on: ubuntu-latest
    name: Build docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build static files
        id: build
        run: npm run docs

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    name: Deploy docs
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
